---
# Server configuration for the Employee Management app host.
#
# Responsibilities (deliberately distinct from Terraform, which creates the
# infrastructure): install and configure the runtime the app needs - Docker,
# the deploy user, directories - and pre-create the deployment path.
#
# Idempotent: safe to run repeatedly.
#
#   ansible-playbook -i inventory.ini playbook.yml
#   ansible-playbook -i inventory.ini playbook.yml --check   # dry run
#
- name: Configure Employee Management app server
  hosts: app
  become: true
  vars:
    app_user: ubuntu
    app_directory: /home/ubuntu/employee-management-devops
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - make
          - python3-pip
        state: present

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker engine and Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Ensure Docker is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add app user to the docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Install AWS CLI (for ECR login in deploys)
      community.general.snap:
        name: aws-cli
        classic: true
      failed_when: false
      changed_when: false

    - name: Verify docker compose is available
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Show docker compose version
      ansible.builtin.debug:
        var: compose_version.stdout

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: /home/{{ app_user }}/backups
        state: directory
        owner: "{{ app_user }}"
        mode: "0755"
