# Prometheus configuration for the Employee Management stack.
#
# Scrapes the FastAPI backend's /metrics endpoint and Prometheus itself.
# Targets use the compose service name "backend".

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: employee-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
