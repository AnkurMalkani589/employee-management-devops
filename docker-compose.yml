# Employee Management - full local stack.
#
#   docker compose up -d
#
# Services:
#   db       - PostgreSQL 16 (persistent volume, init SQL, healthcheck)
#   backend  - FastAPI (waits for db, healthcheck /health)
#   frontend - React SPA served by nginx
#   nginx    - edge reverse proxy (the only published port)
#
# Service discovery uses the compose network: the backend reaches PostgreSQL at
# host "db" (POSTGRES_HOST=db) and nginx reaches "backend"/"frontend" upstreams.

name: employee-management

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-employee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-employee}
      POSTGRES_DB: ${POSTGRES_DB:-employees}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Applied automatically on first init of an empty volume (sorted order).
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed for local debugging only; not required for the stack to work.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-employee} -d ${POSTGRES_DB:-employees}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

  backend:
    # In local dev the image is built from source. CD overrides BACKEND_IMAGE
    # with a pre-built GHCR tag, in which case the image wins over the build.
    image: ${BACKEND_IMAGE:-employee-management-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Service-name-based DB connection (compose network DNS).
      POSTGRES_USER: ${POSTGRES_USER:-employee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-employee}
      POSTGRES_DB: ${POSTGRES_DB:-employees}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_net

  frontend:
    image: ${FRONTEND_IMAGE:-employee-management-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # wget is provided by busybox in nginx:alpine
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_net

volumes:
  db_data:
    driver: local

networks:
  app_net:
    driver: bridge
