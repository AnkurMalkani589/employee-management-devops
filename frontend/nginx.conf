# Nginx config for the frontend container as used standalone / in Kubernetes.
# It serves the SPA and proxies /api to the backend service. In the Docker
# Compose stack, the *edge* nginx (nginx/nginx.conf) does the routing instead
# and this container only serves static files.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SPA fallback - any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API to the backend (service name resolves inside k8s network)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
