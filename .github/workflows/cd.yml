name: CD
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ---------------------------------------------------------------------------
  # 1. Build and push tagged images to GHCR (only for main / real CI success)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute tag
        id: meta
        run: echo "sha_short=$(echo ${GITHUB_SHA} | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.sha_short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ---------------------------------------------------------------------------
  # 2. Deploy to the server, verify health, roll back automatically on failure.
  #
  #    Requires these repository secrets (all documented in README):
  #      DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  #    The deploy target must have Docker + Compose and a checkout of this repo
  #    at DEPLOY_PATH (default /home/ubuntu/employee-management-devops).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy with rollout + rollback
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: "Guard - skip cleanly if deploy secrets are not configured"
        id: guard
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set; skipping deployment (build/registry already succeeded)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.guard.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy on server (with rollback)
        if: steps.guard.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ${DEPLOY_PATH:-/home/ubuntu/employee-management-devops} && \
             IMAGE_TAG='$IMAGE_TAG' \
             BACKEND_IMAGE='${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend' \
             FRONTEND_IMAGE='${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend' \
             bash scripts/deploy.sh"
      - name: Post-deploy smoke test (from runner)
        if: steps.guard.outputs.configured == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://$DEPLOY_HOST:8080/api/health" >/dev/null 2>&1; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "waiting for external health ($i/20)"
            sleep 3
          done
          echo "External smoke test failed" >&2
          exit 1
