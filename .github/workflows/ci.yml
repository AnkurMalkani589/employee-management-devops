name: CI
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + tests (against a real PostgreSQL service for integration)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: employee
          POSTGRES_PASSWORD: employee
          POSTGRES_DB: employees
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U employee -d employees"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests
      - name: Init database schema
        env:
          PGPASSWORD: employee
        run: psql -h localhost -U employee -d employees -f ../database/init/01_schema.sql
      - name: Run tests
        env:
          POSTGRES_TEST_DSN: postgresql+psycopg://employee:employee@localhost:5432/employees
        run: python -m pytest -v --cov=app --cov-report=term-missing
  # ---------------------------------------------------------------------------
  # Frontend: lint + unit tests + production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build (vite)
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
  # ---------------------------------------------------------------------------
  # Security: dependency + secret scanning
  # ---------------------------------------------------------------------------
  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python dependency audit (pip-audit)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: IaC scan (Trivy config)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-config: trivy.yaml
  # ---------------------------------------------------------------------------
  # Docker: build images (no push on PRs)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: employee-management-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: employee-management-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: employee-management-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: employee-management-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
